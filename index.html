  <body>
    <main id="main">
      <div id="bars">
        <h1 id="bar-1">
          <span
            class="sr-only"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              padding: 0;
              margin: -1px;
              overflow: hidden;
              clip: rect(0, 0, 0, 0);
              white-space: nowrap;
              border: 0;
            "
            >Rajeev Mandle - </span

        <div id="bar-2"></div>
        <div id="bar-3"></div>
        <div id="bar-4"></div>
        <div id="bar-5"></div>
      </div>
      <br />
      <div id="terminal">
        <div>
          <span id="prompt"
            ><span id="pre-user"></span>@<span id="pre-host"></span>:$ ~
          </span>
        </div>
        <!-- command output will be inserted before #write-lines-->
        <a id="write-lines"></a>
      </div>
      <div id="input-line">
        <div>
          <p id="password-input" style="display: none">
            Password:
            <input id="password-field" autocomplete="off" type="password" />
          </p>
          <p id="input-hidden">
            <span id="prompt"
              ><span id="user"></span>@<span id="host"></span>:$ ~
            </span>
            <input
              id="user-input"
              type="text"
              enterkeyhint="Enter"
              spellcheck="false"
              autocapitalize="none"
              autocomplete="off"
            />
          </p>
        </div>
        <br />
      </div>
    </main>
